[package]
name = "rigscope"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
description = "Detailed hardware configuration viewer for Linux and Windows"

[[bin]]
name = "rigscope"
path = "src/main.rs"
# Cargo links the Windows manifest (requireAdministrator) into the binary's test harness too;
# every test lives in the library (src/lib.rs), so the binary has none to build.
test = false

[dependencies]
anyhow.workspace = true
eframe.workspace = true
rigscope-engine.workspace = true
rigscope-model.workspace = true
rigscope-probe.workspace = true
# On every OS: `--fixture` opens Windows fixtures everywhere; RealWin is cfg(windows) inside it.
rigscope-probe-win.workspace = true
# On every OS too: `--fixture` opens macOS fixtures everywhere; RealMac only runs on macOS.
rigscope-probe-mac.workspace = true
rigscope-ui.workspace = true
serde_json.workspace = true
arboard = { workspace = true, features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
