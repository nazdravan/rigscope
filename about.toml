# Licences of the crates built into rigscope: `packaging/licences.sh` turns them into
# dist/THIRD-PARTY.txt, which goes into every package. A crate under a licence that is not listed
# here stops the generation (--fail). The order matters: for a dual-licensed crate
# (MIT OR Apache-2.0) the first one listed is chosen; MIT keeps the author's copyright line.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    # webpki-roots (the TLS roots of app-update): permissive.
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
]
# Only normal dependencies end up in the binary, not the test and build ones.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# The release targets (release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# egui's fonts (default_fonts) are built into the binary. The crate has no LICENSE files, only
# fonts/*.txt, which cargo-about does not find on its own: without this it would put generic
# MIT/OFL texts and leave out Hack (Bitstream Vera) and emoji-icon-font. On a new egui the
# checksums stop matching and the generation stops: check the files and update the sums
# (shasum -a 256).
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND Ubuntu-font-1.0 AND MIT AND Bitstream-Vera"

[[epaint_default_fonts.clarify.files]]
path = "fonts/UFL.txt"
license = "Ubuntu-font-1.0"
checksum = "2f0015108d68627bd788d313f529c21ff4da2c2c42a5e1f3883acc83480f9002"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
checksum = "6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2"

[[epaint_default_fonts.clarify.files]]
path = "fonts/Hack-Regular.txt"
license = "Bitstream-Vera"
checksum = "47c0cccbeec7e8614548cc485588b28149e7874188df5f41b36efebcee285c87"

[[epaint_default_fonts.clarify.files]]
path = "fonts/emoji-icon-font-mit-license.txt"
