name: Release

# Push to `main` -> tests. If the version in Cargo.toml is not published yet -> build the packages
# and publish release "rigscope v<version>" (tag v<version>, with SHA256SUMS.txt) once every file
# is uploaded. A published release is never overwritten: a fix is a new version.
# Run by hand (workflow_dispatch): build and test any branch, no release.
# The steps are in docs/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test run, e.g. 0.2.0-rc.1 (empty: from Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    timeout-minutes: 10
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      # true: build the packages (unpublished version, or a manual run).
      build: ${{ steps.published.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Read the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::\"$v\" is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          case "$v" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### rigscope v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      # A published release is not overwritten: if the version exists, a normal push to main
      # runs only the tests.
      - id: published
        name: Check whether the version is already published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          build=true
          if [ "$EVENT" = push ] &&
            draft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" &&
            [ "$draft" != "true" ]; then
            build=false
            echo "rigscope v$VERSION is already published: tests only. For a new release: packaging/version.sh set <version>." >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"
      # The release notes come from CHANGELOG.md: without the section the builds do not start
      # (they would fail only at publishing).
      - name: Check CHANGELOG.md
        if: github.event_name == 'push' && steps.published.outputs.build == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: packaging/changelog.sh "$VERSION" >/dev/null

  test:
    timeout-minutes: 45
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      - name: System libraries
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-test
      - run: cargo xtask ci

  linux:
    timeout-minutes: 45
    name: Linux x86_64
    needs: version
    if: needs.version.outputs.build == 'true'
    # The oldest supported Ubuntu, so the binary runs against its glibc (2.35) and newer.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      - name: System libraries
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux
      - name: Apply the test version
        if: inputs.version != ''
        run: packaging/version.sh set "$VERSION"
      - run: packaging/linux/package.sh
      - run: packaging/linux/appimage.sh
      - run: packaging/linux/deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  macos:
    timeout-minutes: 60
    name: macOS universal
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both macOS targets come from rust-toolchain.toml's channel.
      - name: Install the Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos
      - name: Apply the test version
        if: inputs.version != ''
        run: packaging/version.sh set "$VERSION"
      - run: packaging/macos/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-universal
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: [version, test]
    if: needs.version.outputs.build == 'true'
    # LTO (thin, one codegen unit) makes the release build slow.
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: rustup show
      # packaging/version.sh only needs sed, grep, head and cargo, all in Git Bash on the runner.
      - name: Apply the test version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/version.sh set "$VERSION"
      # build.rs embeds the manifest, icon and version with embed-resource: it needs rc.exe, which
      # the runner's Windows SDK provides.
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo build --release --locked -p rigscope --target x86_64-pc-windows-msvc
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/rigscope.exe "dist/rigscope-$VERSION-windows-x86_64.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    timeout-minutes: 10
    name: GitHub Release
    # Only on a push to main with every build and the tests green; manual runs stop after the builds.
    if: >-
      github.event_name == 'push' && needs.version.outputs.build == 'true' &&
      !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [version, test, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/changelog.sh "$VERSION" >"$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      # The release is created as a draft, every file is uploaded, and only then it is
      # published, so nobody sees it half-done.
      - name: Publish the release
        working-directory: artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          title="rigscope v$VERSION"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag was already published (by an earlier run)."
              exit 1
            fi
            echo "A leftover draft $tag exists: replacing its files"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --title "$title" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$tag" --clobber -- *
          else
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes -- *
          fi
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
          {
            echo "Published **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
