name: ci

# `cargo xtask ci` (fmt, clippy -D warnings, tests, layer rules, wasm check). Linux is the target
# platform: there the tests also read the runner's real /proc and /sys. macOS is the development
# platform (the app runs in demo mode there). Windows: real hardware read through rigscope-win (the only crate with unsafe); its tests also read the runner's real hardware.
# The Windows runners have the Windows SDK (rc.exe, needed by apps/rigscope/build.rs) and run elevated,
# which the is_elevated test relies on when GITHUB_ACTIONS is set.
# Runner images, the Rust toolchain (rust-toolchain.toml) and the actions (by commit SHA) are
# pinned, so a run only changes when this repository does. To update an action, look up the
# release's commit SHA and change it together with the version comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain, components and the wasm target come from rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup show

      - name: Install Linux libraries for eframe/winit and the file dialogs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: fmt, clippy, tests, layers, wasm
        run: cargo xtask ci
