[package]
name = "rigscope-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windows FFI for rigscope: the only crate allowed to use unsafe"

[dependencies]
serde.workspace = true

[target.'cfg(windows)'.dependencies]
wmi.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Performance",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Properties",
  "Win32_Graphics_Dxgi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Wdk_Graphics_Direct3D",
] }

# Not `[lints] workspace = true`: unsafe_code is "deny" here (allowed per module, see
# xtask/src/unsafe_scope.rs); the clippy lints are the workspace's, repeated.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
