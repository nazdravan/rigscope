[package]
name = "rigscope-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "rigscope session, command registry, history and panic guard"

[features]
# Public FakeEnv for tests of this and higher crates.
testutil = ["dep:rigscope-probe", "rigscope-smbios/testutil"]

[dependencies]
rigscope-model.workspace = true
rigscope-probe = { workspace = true, optional = true }
rigscope-smbios = { workspace = true, optional = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
rigscope-engine = { path = ".", features = ["testutil"] }
proptest.workspace = true
rigscope-probe-win = { workspace = true, features = ["testutil"] }

[lints]
workspace = true
